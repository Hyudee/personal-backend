spring.application.name=personal-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/personal_trainer
spring.datasource.username=postgres
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true

# ==== Pagamento manual (Pix + Wpp) ===
app.payment.whatsapp-number = ${PERSONAL_WHATSAPP:}

app.payment.pay-message-template=Olá! Me cadastrei no app e escolhi o plano {plano} ({valor}). Quero pagar por aqui. Nome: {nome} | E-mail: {email} | Cadastro nº {draftId}
app.payment.pix-paid-message-template=Olá! Acabei de pagar o plano {plano} ({valor}) via Pix (chave {chavePix}). Segue o comprovante. Nome: {nome} | E-mail: {email} | Cadastro nº {draftId}